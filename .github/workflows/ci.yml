name: CI

on:
  push:
    branches: [full]
  pull_request:
    branches: [full]

jobs:
  build:
    name: typecheck / build / sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # pro-components beta（peer 冲突根源）已随死代码清理移除，npm ci 可干净解析
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Build web
        working-directory: web
        run: npm run build

      # sync-assets.mjs fails hard if web/dist is missing, so this
      # also proves the full build chain (director-mcp -> bridge, dist -> site)
      - name: Sync plugin assets
        working-directory: dsh-plugin
        run: npm run sync

      - name: Upload web dist
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          retention-days: 7
          if-no-files-found: error

  bridge-selftest:
    name: director-mcp bridge selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 桥是零依赖 node 服务：无需安装，直接跑回路自测
      # （executor 注册 / ready / tool 回路 / desk 路由 / MCP 门面 / 跨站 Origin 拒绝）
      - name: Run bridge selftest
        working-directory: director-mcp
        run: node bridge-selftest.js
